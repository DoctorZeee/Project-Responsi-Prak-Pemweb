<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftBazaar - Registrasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-form-side">
        <div class="auth-header">
            <h1>Buat Akun Baru</h1>
            <p>Sudah mendaftar? <span onclick="window.location.href='Signin.html'" style="cursor: pointer; color: var(--color-primary);">Masuk di sini →</span></p>
        </div>

        <form id="registerForm">
            <input type="hidden" name="role" id="roleInput" value="buyer">

            <div class="form-row">
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Username</label>
                    <div class="input-wrapper">
                        <input type="text" name="username" placeholder="steve_builder" required>
                    </div>
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Email</label>
                    <div class="input-wrapper">
                        <input type="email" name="email" placeholder="steve@craft.com" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password" placeholder="Minimal 6 karakter" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Konfirmasi Password</label>
                <div class="input-wrapper">
                    <input type="password" name="confirm_password" placeholder="Ulangi password anda" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Mendaftar Sebagai</label>
                <div class="role-grid" style="grid-template-columns: 1fr 1fr;">
                    <div id="regBuyer" class="role-card active" onclick="setRegRole('buyer')">
                        <div style="font-size: 20px;">🧑</div>
                        <div class="title" style="font-weight:700; font-size:13px; margin-top:4px;">Buyer</div>
                    </div>
                    <div id="regSeller" class="role-card" onclick="setRegRole('seller')">
                        <div style="font-size: 20px;">🏪</div>
                        <div class="title" style="font-weight:700; font-size:13px; margin-top:4px;">Seller</div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">🎮 Daftarkan Akun</button>
        </form>
    </div>

    <div class="auth-banner">
        <div style="font-family: 'Press Start 2P'; font-size: 18px;">
            <span style="color: var(--color-primary);">⚔ Craft</span><span style="color: var(--color-text-rare);">Bazaar</span>
        </div>
        <p style="color: var(--color-text-muted); font-size: 13px; margin-top: 8px;">Minecraft Item & Skin Marketplace</p>
    </div>
</div>

<script>
// Fungsi untuk memilih role visual dan mengganti value hidden input
function setRegRole(role) {
    document.getElementById('roleInput').value = role;
    document.querySelectorAll('.role-card').forEach(card => card.classList.remove('active'));
    if(role === 'buyer') document.getElementById('regBuyer').classList.add('active');
    if(role === 'seller') document.getElementById('regSeller').classList.add('active');
}

// Fungsi Submit Pendaftaran
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Mencegah reload halaman
    
    const formData = new FormData(this);
    
    // Validasi dasar di sisi frontend
    if(formData.get('password') !== formData.get('confirm_password')) {
        alert("Error: Password dan konfirmasi tidak sesuai!");
        return;
    }
    
    // Tembak API Register Backend
    fetch('../Backend/auth/register.php', { method: 'POST', body: formData })
    .then(res => {
        if (!res.ok) { return res.json().then(err => { throw err; }); }
        return res.json();
    })
    .then(data => {
        if(data.success) { 
            alert("Berhasil Mendaftar! Silakan login untuk melanjutkan."); 
            // Arahkan ke halaman login
            window.location.href = 'Signin.html'; 
        }
    })
    .catch(error => {
        // Menangkap error validasi dari backend (seperti email sudah dipakai, dll)
        if (error.errors && error.errors.length > 0) {
            alert("Gagal: \n- " + error.errors.join("\n- "));
        } else {
            alert("Gagal Mendaftar: " + (error.message || "Kesalahan pada server"));
        }
    });
});
</script>
</body>
</html>
