<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftBazaar - Registrasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-form-side">
        <div class="auth-header">
            <h1>Buat Akun Baru</h1>
            <p>Sudah mendaftar? <span onclick="window.location.href='Signin.html'" style="cursor:pointer;color:var(--color-primary);">Masuk di sini →</span></p>
        </div>

        <div id="alertBox" style="display:none;background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#F87171;margin-bottom:14px;white-space:pre-line;"></div>

        <input type="hidden" id="roleInput" value="buyer">

        <div class="form-row">
            <div class="form-group" style="flex:1;">
                <label class="form-label">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="steve_builder" required>
                </div>
            </div>
            <div class="form-group" style="flex:1;">
                <label class="form-label">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="steve@craft.com" required>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Minimal 6 karakter" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Konfirmasi Password</label>
            <div class="input-wrapper">
                <input type="password" id="confirm_password" placeholder="Ulangi password" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Daftar Sebagai</label>
            <div class="role-grid" style="grid-template-columns:1fr 1fr;">
                <div id="regBuyer" class="role-card active" onclick="setRole('buyer')">
                    <div style="font-size:24px;">🧑</div>
                    <div class="title" style="font-weight:700;font-size:13px;margin-top:6px;">Buyer</div>
                    <div style="font-size:11px;color:#4A5568;margin-top:3px;">Beli item keren</div>
                </div>
                <div id="regSeller" class="role-card" onclick="setRole('seller')">
                    <div style="font-size:24px;">🏪</div>
                    <div class="title" style="font-weight:700;font-size:13px;margin-top:6px;">Seller</div>
                    <div style="font-size:11px;color:#4A5568;margin-top:3px;">Jual kreasi kamu</div>
                </div>
            </div>
        </div>

        <button class="btn-submit" id="btnRegister" onclick="doRegister()">🎮 Buat Akun</button>
    </div>

    <div class="auth-banner">
        <div style="font-family:'Press Start 2P';font-size:18px;text-align:center;">
            <span style="color:var(--color-primary);">⚔ Craft</span><span style="color:var(--color-text-rare);">Bazaar</span>
        </div>
        <p style="color:var(--color-text-muted);font-size:13px;margin-top:10px;text-align:center;">Minecraft Item &amp; Skin Marketplace</p>
        <div style="margin-top:32px;color:#4A5568;font-size:12px;text-align:center;line-height:1.8;">
            ✓ Ribuan item Minecraft<br>
            ✓ Skin &amp; Resource Pack unik<br>
            ✓ Seller terverifikasi<br>
            ✓ Transaksi aman
        </div>
    </div>
</div>

<script src="assets/app.js"></script>
<script>
function setRole(role) {
    document.getElementById('roleInput').value = role;
    document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
    document.getElementById(role === 'buyer' ? 'regBuyer' : 'regSeller').classList.add('active');
}

async function doRegister() {
    const alertBox = document.getElementById('alertBox');
    const btn      = document.getElementById('btnRegister');

    const username         = document.getElementById('username').value.trim();
    const email            = document.getElementById('email').value.trim();
    const password         = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;
    const role             = document.getElementById('roleInput').value;

    alertBox.style.display = 'none';

    if (password !== confirm_password) {
        alertBox.textContent = 'Password dan konfirmasi tidak cocok.';
        alertBox.style.display = 'block';
        return;
    }

    btn.disabled  = true;
    btn.innerHTML = '<span class="spinner"></span> Memproses...';

    const fd = new FormData();
    fd.append('username',         username);
    fd.append('email',            email);
    fd.append('password',         password);
    fd.append('confirm_password', confirm_password);
    fd.append('role',             role);

    const { ok, data } = await safeFetch(API.register, { method: 'POST', body: fd });

    btn.disabled  = false;
    btn.innerHTML = '🎮 Buat Akun';

    if ((ok || data.success) && data.success) {
        _cachedUser = null;
        toast('Registrasi berhasil! Mengalihkan...');
        setTimeout(() => window.location.href = data.redirect, 700);
    } else {
        const errMsg = data.errors ? data.errors.join('\n') : (data.message || 'Registrasi gagal.');
        alertBox.textContent = errMsg;
        alertBox.style.display = 'block';
    }
}
</script>
</body>
</html>
