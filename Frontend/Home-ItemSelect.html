<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftBazaar - Detail Item</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #0A0A0F; color: #F0F4FF; font-family: 'Space Grotesk', sans-serif;">

<nav class="main-navbar">
    <div class="nav-logo" onclick="window.location.href='Marketplace-main.html'" style="cursor: pointer;">
        <span>⚔ Craft</span><span style="color: var(--color-text-rare);">Bazaar</span>
    </div>
    <div class="nav-links">
        <a href="#" id="navAkun">Akun</a>
        <a href="Marketplace-main.html">Marketplace</a>
    </div>
    <div class="nav-user-zone" id="navUserZone"></div>
</nav>

<div style="max-width: 1200px; margin: 40px auto; padding: 0 20px;">
    <a href="Marketplace-main.html" style="color: #4ADE80; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 25px; font-family: 'JetBrains Mono', monospace;">
        ← Kembali ke Marketplace
    </a>

    <div id="detailContainer">
        <div style="text-align:center; padding:60px; color:#4A5568;">
            <p>Memuat detail item...</p>
        </div>
    </div>
</div>

<script src="assets/app.js"></script>
<script>
const RARITY_EMOJI = {
    legendary: '⭐', epic: '💎', rare: '🔹', uncommon: '🌿', common: '📦'
};

document.addEventListener('DOMContentLoaded', () => {
    renderNavbar();
    fetchItemDetail();
});

async function fetchItemDetail() {
    const container = document.getElementById('detailContainer');
    const urlParams = new URLSearchParams(window.location.search);
    const itemId = urlParams.get('id');

    if (!itemId) {
        showError("ID Item tidak valid atau tidak ditemukan di URL.");
        return;
    }

    // Mengambil data detail item melalui API Backend
    const { data } = await safeFetch(`${API.itemDetail}?id=${itemId}`);

    if (!data || !data.success || !data.data) {
        showError("Item tidak ditemukan. Pastikan data di database sudah sesuai.");
        return;
    }

    const item = data.data;
    
    // Konfigurasi warna tag berdasarkan tingkat kelangkaan (rarity)
    const rarityColors = {
        legendary: { badge: '#FBBF24', border: '#92400E' },
        epic:      { badge: '#C084FC', border: '#6B21A8' },
        rare:      { badge: '#60A5FA', border: '#1E40AF' },
        uncommon:  { badge: '#4ADE80', border: '#166534' },
        common:    { badge: '#94A3B8', border: '#475569' },
    };
    const rc = rarityColors[item.rarity] || rarityColors.common;

    container.innerHTML = `
        <div style="display: flex; gap: 40px; background: #12141F; border: 1px solid #252840; padding: 30px; border-radius: 12px; flex-wrap: wrap;">
            
            <div style="flex: 1; min-width: 300px; background: #1E2235; height: 350px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 120px; border: 1px solid #252840;">
                ${RARITY_EMOJI[item.rarity] || '📦'}
            </div>

            <div style="flex: 1.5; min-width: 300px; display: flex; flex-direction: column; gap: 16px;">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <span class="mono-badge" style="color:${rc.badge}; background:${rc.badge}20; border-color:${rc.border}; text-transform:uppercase; font-size: 11px;">
                        ${item.rarity}
                    </span>
                    <span style="color: #8892B0; font-size: 14px;">★ ${parseFloat(item.avg_rating || 0).toFixed(1)}</span>
                    <span style="color: #4A5568; font-size: 14px;">| Terjual: ${item.total_sold || 0}</span>
                </div>

                <h1 style="color: #F0F4FF; margin: 0; font-size: 32px; font-weight: 700;">${item.name}</h1>
                <div style="color: #8892B0; font-size: 14px;">
                    Dibuat oleh <span style="color: #4ADE80; font-weight: bold;">${item.seller_name}</span> 
                    dalam kategori <span style="color: #FBBF24;">${item.category_name}</span>
                </div>
                
                <div style="border-top: 1px solid #252840; border-bottom: 1px solid #252840; padding: 16px 0; color: #8892B0; font-size: 15px; line-height: 1.6; min-height: 100px;">
                    ${item.description || 'Tidak ada deskripsi tersedia untuk produk ini.'}
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 20px;">
                    <div>
                        <div style="color: #4A5568; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace;">Harga Item</div>
                        <div style="color: #4ADE80; font-size: 28px; font-family: 'JetBrains Mono', monospace; font-weight: 700; margin-top: 4px;">${fRupiah(item.price)}</div>
                    </div>
                    
                    <div style="text-align: right;">
                        <div style="color: #4A5568; font-size: 12px; margin-bottom: 8px;">Stok Tersedia: <span style="color: #F0F4FF; font-weight: bold;">${item.stock}</span></div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <input type="number" id="qtyInput" value="1" min="1" max="${item.stock}" style="width: 60px; background: #181B2A; border: 1px solid #252840; color: #F0F4FF; padding: 10px; border-radius: 6px; text-align: center; font-family: 'JetBrains Mono', monospace;">
                            <button class="btn-primary" onclick="addToCart(${item.id})" style="padding: 10px 20px; border-radius: 6px; font-weight: 700; font-size: 13px;">
                                🛒 + Keranjang
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    `;
}

function showError(msg) {
    document.getElementById('detailContainer').innerHTML = `
        <div class="empty-state" style="text-align: center; padding: 60px 0; background: #12141F; border: 1px solid #252840; border-radius: 12px;">
            <div class="icon" style="font-size: 48px; margin-bottom: 16px;">❌</div>
            <p style="color: #8892B0; font-size: 16px; margin: 0 0 20px 0;">${msg}</p>
            <a href="Marketplace-main.html" class="btn-primary" style="display: inline-block; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: bold;">
                Kembali ke Marketplace
            </a>
        </div>
    `;
}

async function addToCart(itemId) {
    const user = await getUser();
    if (!user) {
        toast('Silakan login terlebih dahulu.', 'error');
        setTimeout(() => window.location.href = 'Signin.html', 800);
        return;
    }
    if (user.role !== 'buyer') {
        toast('Hanya akun dengan akses Buyer yang bisa menambah ke cart.', 'error');
        return;
    }

    const qty = parseInt(document.getElementById('qtyInput').value) || 1;

    const fd = new FormData();
    fd.append('item_id',  itemId);
    fd.append('quantity', qty);

    const { data } = await safeFetch(API.cartAdd, { method: 'POST', body: fd });

    if (data.success) {
        toast('Item berhasil ditambahkan ke keranjang! 🛒');
        if (_cachedUser) { _cachedUser.cart_count = data.cart_count; }
        renderNavbar();
    } else {
        toast(data.message || 'Gagal menambahkan ke keranjang.', 'error');
    }
}
</script>
</body>
</html>
