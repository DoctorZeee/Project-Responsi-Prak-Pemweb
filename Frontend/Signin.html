<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftBazaar - Masuk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-banner">
        <div style="font-family: 'Press Start 2P'; font-size: 18px;">
            <span style="color: var(--color-primary);">⚔ Craft</span><span style="color: var(--color-text-rare);">Bazaar</span>
        </div>
        <p style="color: var(--color-text-muted); font-size: 13px; margin-top: 8px;">Minecraft Item & Skin Marketplace</p>
    </div>

    <div class="auth-form-side">
        <div class="auth-header">
            <h1>Masuk Akun</h1>
            <p>Belum punya akun? <span onclick="window.location.href='Regist.html'">Daftar di sini →</span></p>
        </div>

        <form id="loginForm">
            <input type="hidden" id="selectedRole" name="role" value="buyer">

            <div class="form-group">
                <label class="form-label">Pilih Akses Role</label>
                <div class="role-grid">
                    <div id="roleBuyer" class="role-card active" onclick="selectRole('buyer')">
                        <div style="font-size: 18px;">🧑</div>
                        <div class="title" style="font-size: 12px; font-weight:700; margin-top:4px;">Buyer</div>
                    </div>
                    <div id="roleSeller" class="role-card" onclick="selectRole('seller')">
                        <div style="font-size: 18px;">🏪</div>
                        <div class="title" style="font-size: 12px; font-weight:700; margin-top:4px;">Seller</div>
                    </div>
                    <div id="roleAdmin" class="role-card" onclick="selectRole('admin')">
                        <div style="font-size: 18px;">🛡️</div>
                        <div class="title" style="font-size: 12px; font-weight:700; margin-top:4px;">Admin</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Username / Email</label>
                <div class="input-wrapper">
                    <input type="text" name="username" placeholder="Masukkan nama atau email anda" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">🚀 Masuk </button>
        </form>
    </div>
</div>

<script>
function selectRole(role) {
    document.getElementById('selectedRole').value = role;
    document.querySelectorAll('.role-card').forEach(card => card.classList.remove('active'));
    if (role === 'buyer') document.getElementById('roleBuyer').classList.add('active');
    if (role === 'seller') document.getElementById('roleSeller').classList.add('active');
    if (role === 'admin') document.getElementById('roleAdmin').classList.add('active');
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    fetch('/auth/login.php', { method: 'POST', body: formData })
    .then(res => res.json())
    .then(data => {
        if (data.success) { alert(data.message); window.location.href = data.redirect; }
        else { alert("Gagal Masuk: " + data.message); }
    }).catch(() => alert("Koneksi backend belum aktif, HTML/CSS sukses teruji!"));
});
</script>
</body>
</html>
