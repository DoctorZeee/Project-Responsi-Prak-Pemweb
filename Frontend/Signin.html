<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftBazaar - Masuk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-banner">
        <div style="font-family: 'Press Start 2P'; font-size: 18px;">
            <span style="color: var(--color-primary);">⚔ Craft</span><span style="color: var(--color-text-rare);">Bazaar</span>
        </div>
        <p style="color: var(--color-text-muted); font-size: 13px; margin-top: 8px;">Minecraft Item & Skin Marketplace</p>
    </div>

    <div class="auth-form-side">
        <div class="auth-header">
            <h1>Masuk Akun</h1>
            <p>Belum punya akun? <span onclick="window.location.href='Regist.html'" style="cursor: pointer; color: var(--color-primary);">Daftar di sini →</span></p>
            <p style="margin-top: 10px; font-size: 12px;">
                Atau <span onclick="window.location.href='Marketplace-main.html'" style="cursor: pointer; color: var(--color-text-rare); text-decoration: underline;">Lihat Marketplace tanpa login</span>
            </p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Username / Email</label>
                <div class="input-wrapper">
                    <input type="text" name="identifier" placeholder="Masukkan nama atau email anda" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">🚀 Masuk </button>
        </form>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);

    fetch('../Backend/auth/login.php', { 
        method: 'POST', 
        body: formData 
    })
    .then(async res => {
        // Ambil data dari server sebagai teks mentah dulu (jangan langsung di-JSON-kan)
        const text = await res.text();
        
        try {
            // Coba terjemahkan ke JSON
            const data = JSON.parse(text);
            return { ok: res.ok, data: data };
        } catch (err) {
            // JIKA GAGAL: Jangan tampilkan error JSON ke user! 
            // Kita print error aslinya di console untuk developer, dan tampilkan alert ramah ke user
            console.error("Pesan Error Asli dari PHP:\n", text);
            throw new Error("Terjadi gangguan pada server. Silakan coba lagi nanti.");
        }
    })
    .then(result => {
        const data = result.data;
        if (result.ok && data.success) { 
            alert(data.message);
            // Arahkan sesuai role
            if (data.role === 'seller' || data.role === 'admin') {
                window.location.href = 'admin-home.html';
            } else {
                window.location.href = 'Marketplace-main.html';
            }
        } else { 
            alert("Gagal Masuk: " + (data.message || "Username/Password salah.")); 
        }
    })
    .catch(error => {
        alert(error.message); // Tampilkan alert "Terjadi gangguan pada server"
    });
});
</script>
</body>
</html>
